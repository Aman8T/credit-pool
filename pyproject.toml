[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "creditpool"
version = "0.1.0"
description = "Local-first, quota-aware task runner for official coding CLIs"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "CreditPool contributors" }]
keywords = ["cli", "git", "agents", "claude", "codex"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "typer>=0.12.0",
  "pydantic>=2.6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
creditpool = "creditpool.cli:app"

[project.urls]
Homepage = "https://github.com/Aman8T/credit-pool"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
